[package]
name = "troika"
repo = "ecmwf/troika"
visibility = "public"
fork-pull-requests = false
compiler-inputs = []
ci-schedule = "49 3 * * *"
ci-pre-commit = false
full-history = true

[matrix.test]
triggers = ["upstream-change", "rebuild-request"]

[matrix.test.defaults]
sccache = false
job-script = "./.ci/test.sh.j2"
runs-on = "ubuntu-26.04"
platform = "gh-ubuntu-26.04"
extras = "tests"

[[matrix.test.include]]
python-version = "3.11"

[[matrix.test.include]]
python-version = "3.12"

[[matrix.test.include]]
python-version = "3.13"
