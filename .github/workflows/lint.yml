name: lint

on:
  # Trigger the workflow on push to master or develop, except tag creation
  push:
    branches:
      - "master"
      - "develop"
    tags-ignore:
      - "**"

  # Trigger the workflow on pull request
  pull_request: ~

  # Trigger the workflow manually
  workflow_dispatch: ~

jobs:
  mypy_and_linting:
    name: mypy and linting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install package with type-checking dependencies
        run: python -m pip install -e '.[tests]' pre-commit
      - name: Run pre commit
        run: |
          pre-commit run --all-files
      - name: Run mypy
        run: mypy src/troika
